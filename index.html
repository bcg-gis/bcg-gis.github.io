<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BCG – Fiber Optik GIS Paneli</title>
    <meta name="description" content="Baku Communications Group fiber optik şəbəkəsinin GIS idarəetmə paneli.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0e1a2b">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css?v=20261101a">
</head>
<body>

    <!-- GİRİŞ -->
    <div class="login" id="login" hidden>
        <section class="login-aside">
            <div class="login-mark"><img src="favicon.svg" alt=""> <span>Baku Communications Group</span></div>
            <svg class="login-net" viewBox="0 0 600 420" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M30 360 L150 280 L260 300 L360 190 L470 170 L570 60"/>
                    <path d="M150 280 L120 150 L240 90 L360 190"/>
                    <path d="M260 300 L340 380 L500 330 L470 170"/>
                    <path d="M240 90 L420 40 L470 170"/>
                </g>
                <g fill="currentColor">
                    <circle cx="30" cy="360" r="4"/><circle cx="150" cy="280" r="6"/><circle cx="260" cy="300" r="4"/>
                    <circle cx="360" cy="190" r="7"/><circle cx="470" cy="170" r="5"/><circle cx="570" cy="60" r="4"/>
                    <circle cx="120" cy="150" r="4"/><circle cx="240" cy="90" r="5"/><circle cx="340" cy="380" r="4"/>
                    <circle cx="500" cy="330" r="4"/><circle cx="420" cy="40" r="4"/>
                </g>
            </svg>
            <div class="login-copy">
                <h1 data-i18n="loginHeadline"></h1>
                <p data-i18n="loginLead"></p>
            </div>
        </section>
        <section class="login-main">
            <select class="input login-lang" id="loginLang" aria-label="Dil">
                <option value="az">AZ</option>
                <option value="en">EN</option>
                <option value="ru">RU</option>
            </select>
            <form class="login-form" id="loginForm" novalidate>
                <h2 data-i18n="loginTitle"></h2>
                <p data-i18n="loginHint"></p>
                <label>
                    <span data-i18n="loginUser"></span>
                    <input class="input" id="loginUser" type="email" autocomplete="username" autofocus>
                </label>
                <label>
                    <span data-i18n="loginPass"></span>
                    <input class="input" id="loginPass" type="password" autocomplete="current-password">
                </label>
                <p class="login-error" id="loginError" role="alert"></p>
                <button class="btn btn-primary btn-block" type="submit" data-i18n="loginBtn"></button>
            </form>
        </section>
    </div>

    <!-- ÜST PANEL -->
    <header class="appbar">
        <button class="bar-btn" id="sidebarToggle" data-i18n-title="togglePanel"><i class="fa-solid fa-bars-staggered"></i></button>
        <div class="brand">
            <img src="favicon.svg" alt="">
            <strong>BCG</strong>
            <span class="brand-sub" data-i18n="brandSubtitle"></span>
        </div>

        <button class="bar-btn menu-btn" id="menuBtn" data-i18n-title="menu" aria-expanded="false"><i class="fa-solid fa-ellipsis-vertical"></i></button>

        <div class="top-actions" id="topActions">
            <button class="bar-item" id="notesBtn">
                <i class="fa-regular fa-note-sticky"></i> <span data-i18n="notes"></span>
                <span class="count" id="notesCount" hidden></span>
            </button>
            <button class="bar-item" id="materialsBtn"><i class="fa-solid fa-boxes-stacked"></i> <span data-i18n="materials"></span></button>
            <button class="bar-item" id="importBtn"><i class="fa-solid fa-arrow-up-from-bracket"></i> <span data-i18n="import"></span></button>
            <input type="file" id="importFile" accept=".kmz,.kml,.geojson,.json" multiple hidden>
            <button class="bar-item" id="printBtn"><i class="fa-solid fa-print"></i> <span data-i18n="print"></span></button>
            <span class="bar-sep"></span>
            <select class="bar-select" id="langSelect" aria-label="Dil">
                <option value="az">AZ</option>
                <option value="en">EN</option>
                <option value="ru">RU</option>
            </select>
            <button class="bar-btn" id="themeBtn" data-i18n-title="theme" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-palette"></i></button>
            <span class="bar-sep"></span>
            <div class="user">
                <span class="avatar" id="userAvatar"></span>
                <span class="user-text">
                    <strong id="userEmail"></strong>
                    <small id="roleBadge"></small>
                </span>
            </div>
            <button class="bar-btn" id="logoutBtn" data-i18n-title="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
        <div class="theme-menu" id="themeMenu" hidden></div>
    </header>

    <div class="workspace" id="workspace">

        <!-- SOL PANEL -->
        <aside class="sidebar" id="sidebar">
            <div class="side-view" id="listView">
                <div class="summary">
                    <div class="kpis" id="kpis"></div>
                    <div class="progress" aria-hidden="true"><span id="totalProgress"></span></div>
                </div>
                <div class="filters">
                    <div class="search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input class="input" id="searchInput" type="search" data-i18n-placeholder="search">
                    </div>
                    <div class="chips" id="statusChips"></div>
                </div>
                <div class="list-head">
                    <h2><span data-i18n="projects"></span> <span class="muted" id="projectCount"></span></h2>
                    <span>
                        <button class="link" id="showAllBtn" data-i18n="showAll"></button>
                        <button class="link" id="hideAllBtn" data-i18n="hideAll"></button>
                    </span>
                </div>
                <div class="project-list" id="projectList"></div>
            </div>
            <div class="side-view" id="detailView" hidden></div>
        </aside>

        <div class="map-column">
            <div class="map-stage">
                <main id="map" aria-label="Xəritə"></main>

                <nav class="toolbar" aria-label="Xəritə alətləri">
                    <div class="toolbar-main">
                    <div class="tool-group">
                        <button class="tool" id="zoomInBtn" data-i18n-title="zoomIn"><i class="fa-solid fa-plus"></i></button>
                        <button class="tool" id="zoomOutBtn" data-i18n-title="zoomOut"><i class="fa-solid fa-minus"></i></button>
                    </div>
                    <div class="tool-group">
                        <button class="tool" id="homeBtn" data-i18n-title="home"><i class="fa-solid fa-expand"></i></button>
                        <button class="tool" id="northBtn" data-i18n-title="north"><i class="fa-solid fa-location-arrow" id="northIcon"></i></button>
                        <button class="tool" id="fullscreenBtn" data-i18n-title="fullscreen"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></button>
                    </div>
                    <div class="tool-group">
                        <button class="tool" id="layersBtn" data-i18n-title="layers"><i class="fa-solid fa-layer-group"></i></button>
                        <button class="tool" id="namesBtn" data-i18n-title="names"><i class="fa-solid fa-tag"></i></button>
                        <button class="tool" id="coordBtn" data-i18n-title="coords"><i class="fa-solid fa-magnifying-glass-location"></i></button>
                    </div>
                    </div>
                    <div class="tool-dock" id="toolDock"></div>
                </nav>

                <div class="popover" id="layersPopover" hidden>
                    <h3 data-i18n="layers"></h3>
                    <div id="layerOptions"></div>
                </div>

                <div class="popover" id="coordPopover" hidden>
                    <h3 data-i18n="coordTitle"></h3>
                    <label>
                        <span data-i18n="coordClicked"></span>
                        <span class="field">
                            <input class="input mono" id="coordClicked" readonly data-i18n-placeholder="coordPlaceholder">
                            <button class="icon-btn" id="coordCopy" data-i18n-title="copy"><i class="fa-regular fa-copy"></i></button>
                        </span>
                    </label>
                    <form id="coordForm">
                        <label>
                            <span data-i18n="coordGoTo"></span>
                            <span class="field">
                                <input class="input mono" id="coordGoTo" placeholder="40.4093, 49.8671" inputmode="decimal">
                                <button class="icon-btn" type="submit" data-i18n-title="go"><i class="fa-solid fa-arrow-right"></i></button>
                            </span>
                        </label>
                    </form>
                </div>

                <div class="tool-area">
                    <div class="draw-panel" id="drawPanel" hidden></div>
                    <div class="tool-hint" id="toolHint" hidden>
                        <span id="toolHintText"></span>
                        <button class="btn btn-primary" id="toolFinish" data-i18n="finish" hidden></button>
                        <button class="icon-btn" id="toolClose" data-i18n-title="close"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="save-menu" id="saveMenu" hidden>
                        <button class="btn btn-outline" id="savePdf"><i class="fa-regular fa-file-pdf"></i> PDF</button>
                        <button class="btn btn-outline" id="saveKmz"><i class="fa-solid fa-earth-europe"></i> KMZ</button>
                    </div>
                </div>
                <section class="legend" id="legend" aria-label="Şərti işarələr"></section>
                <div class="cursor-coords mono" id="cursorCoords">40.14300, 47.57700</div>
            </div>

            <!-- CƏDVƏL -->
            <section class="dock" id="drawer">
                <div class="dock-head">
                    <div class="tabs" role="tablist">
                        <button class="tab active" role="tab" data-tab="segments"><span data-i18n="segments"></span> <span class="muted" id="drawerCount"></span></button>
                        <button class="tab" role="tab" data-tab="contractors"><span data-i18n="contractors"></span> <span class="muted" id="contractorCount"></span></button>
                    </div>
                    <span class="dock-summary mono" id="drawerSummary"></span>
                    <button class="icon-btn" id="drawerToggle" data-i18n-title="togglePanel" aria-expanded="false"><i class="fa-solid fa-chevron-up" id="drawerArrow"></i></button>
                </div>
                <div class="dock-body" id="drawerBody" hidden>
                    <div class="table-wrap" id="segmentsPane">
                        <table>
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                            <tfoot id="tableFoot"></tfoot>
                        </table>
                    </div>
                    <div class="table-wrap" id="contractorsPane" hidden>
                        <table>
                            <thead id="contractorHead"></thead>
                            <tbody id="contractorList"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div class="measure-tip" id="measureTip" hidden></div>

    <!-- MATERİAL REYESTRİ -->
    <dialog class="modal" id="materialsModal">
        <div class="modal-head">
            <div>
                <h2 data-i18n="materials"></h2>
                <p class="muted" data-i18n="materialsHint"></p>
            </div>
            <button class="icon-btn" data-close data-i18n-title="close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="table-wrap">
            <table>
                <thead id="materialsHead"></thead>
                <tbody id="materialsBody"></tbody>
            </table>
        </div>
    </dialog>

    <!-- QEYDLƏR -->
    <dialog class="modal modal-sm" id="notesModal">
        <div class="modal-head">
            <h2 data-i18n="notesTitle"></h2>
            <button class="icon-btn" data-close data-i18n-title="close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="noteForm">
            <textarea class="input" id="noteInput" rows="3" data-i18n-placeholder="notePlaceholder"></textarea>
            <button class="btn btn-primary" type="submit" data-i18n="noteAdd"></button>
        </form>
        <div class="notes" id="notesList"></div>
    </dialog>

    <!-- PAYLAŞMA -->
    <dialog class="modal modal-sm" id="shareModal">
        <div class="modal-head">
            <div>
                <h2 data-i18n="shareTitle"></h2>
                <p class="muted" id="shareHint"></p>
            </div>
            <button class="icon-btn" data-close data-i18n-title="close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form class="share-form" id="shareForm">
            <label>
                <span data-i18n="shareExpiry"></span>
                <select class="input" id="shareDays">
                    <option value="7" data-i18n="days7"></option>
                    <option value="30" selected data-i18n="days30"></option>
                    <option value="0" data-i18n="daysNever"></option>
                </select>
            </label>
            <button class="btn btn-primary" type="submit" data-i18n="shareCreate"></button>
        </form>
        <div class="notes" id="shareList"></div>
    </dialog>

    <div class="link-error" id="linkError" hidden>
        <img src="favicon.svg" alt="">
        <h1 data-i18n="linkInvalid"></h1>
        <p data-i18n="linkInvalidHint"></p>
    </div>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js?v=20261101a"></script>
    <script src="js/api.js?v=20261101a"></script>
    <script src="js/i18n.js?v=20261101a"></script>
    <script src="js/app.js?v=20261101a"></script>
    <script src="js/tools.js?v=20261101a"></script>
</body>
</html>
