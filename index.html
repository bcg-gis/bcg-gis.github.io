<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BCG – Fiber Optik GIS Paneli</title>
    <meta name="description" content="Baku Communications Group fiber optik şəbəkəsinin GIS idarəetmə paneli.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a1220">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- GİRİŞ -->
    <div class="login" id="login" hidden>
        <form class="login-card" id="loginForm" novalidate>
            <div class="login-brand">
                <span class="logo">BCG</span>
                <div>
                    <strong>Baku Communications Group</strong>
                    <small data-i18n="brandSubtitle"></small>
                </div>
            </div>
            <h1 data-i18n="loginTitle"></h1>
            <p data-i18n="loginHint"></p>
            <label>
                <span data-i18n="loginUser"></span>
                <input class="input" id="loginUser" type="email" autocomplete="username" autofocus>
            </label>
            <label>
                <span data-i18n="loginPass"></span>
                <input class="input" id="loginPass" type="password" autocomplete="current-password">
            </label>
            <p class="login-error" id="loginError" role="alert"></p>
            <button class="btn btn-primary btn-block" type="submit">
                <i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="loginBtn"></span>
            </button>
        </form>
    </div>

    <!-- XƏRİTƏ: bütün ekranı tutur, qalan hər şey onun üzərində üzür -->
    <main id="map" aria-label="Xəritə"></main>

    <!-- ÜST PANEL -->
    <header class="topbar glass">
        <div class="brand">
            <span class="logo">BCG</span>
            <div class="brand-text">
                <strong>Baku Communications Group</strong>
                <small data-i18n="brandSubtitle"></small>
            </div>
        </div>

        <button class="icon-btn menu-btn" id="menuBtn" data-i18n-title="menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>

        <div class="top-actions" id="topActions">
            <button class="btn" id="notesBtn">
                <i class="fa-solid fa-note-sticky"></i> <span data-i18n="notes"></span>
                <span class="count" id="notesCount" hidden></span>
            </button>
            <button class="btn" id="materialsBtn"><i class="fa-solid fa-boxes-stacked"></i> <span data-i18n="materials"></span></button>
            <button class="btn" id="importBtn"><i class="fa-solid fa-file-import"></i> <span data-i18n="import"></span></button>
            <input type="file" id="importFile" accept=".kmz,.kml,.geojson,.json" multiple hidden>
            <button class="btn" id="printBtn"><i class="fa-solid fa-print"></i> <span data-i18n="print"></span></button>
            <span class="divider"></span>
            <button class="icon-btn" id="themeBtn" data-i18n-title="theme"><i class="fa-solid fa-moon"></i></button>
            <select class="input lang" id="langSelect" aria-label="Dil">
                <option value="az">AZ</option>
                <option value="en">EN</option>
                <option value="ru">RU</option>
            </select>
            <span class="divider"></span>
            <span class="role" id="roleBadge"></span>
            <button class="icon-btn" id="logoutBtn" data-i18n-title="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
    </header>

    <!-- LAYİHƏLƏR PANELİ -->
    <aside class="sidebar glass" id="sidebar">
        <div class="side-head">
            <h2><i class="fa-solid fa-diagram-project"></i> <span data-i18n="projects"></span> <span class="muted" id="projectCount"></span></h2>
            <button class="icon-btn small" id="sidebarToggle" data-i18n-title="togglePanel"><i class="fa-solid fa-chevron-left"></i></button>
        </div>
        <div class="side-body">
            <div class="kpis" id="kpis"></div>
            <div class="progress" aria-hidden="true"><span id="totalProgress"></span></div>
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input class="input" id="searchInput" type="search" data-i18n-placeholder="search">
            </div>
            <div class="chips" id="statusChips"></div>
            <div class="list-actions">
                <button class="link" id="showAllBtn" data-i18n="showAll"></button>
                <button class="link" id="hideAllBtn" data-i18n="hideAll"></button>
            </div>
            <div class="project-list" id="projectList"></div>
        </div>
    </aside>
    <button class="sidebar-open glass" id="sidebarOpen" data-i18n-title="togglePanel" hidden><i class="fa-solid fa-diagram-project"></i></button>

    <!-- XƏRİTƏ ALƏTLƏRİ -->
    <nav class="rail" aria-label="Xəritə alətləri">
        <div class="rail-group glass">
            <button class="rail-btn" id="zoomInBtn" data-i18n-title="zoomIn"><i class="fa-solid fa-plus"></i></button>
            <button class="rail-btn" id="zoomOutBtn" data-i18n-title="zoomOut"><i class="fa-solid fa-minus"></i></button>
        </div>
        <div class="rail-group glass">
            <button class="rail-btn" id="homeBtn" data-i18n-title="home"><i class="fa-solid fa-house"></i></button>
            <button class="rail-btn" id="northBtn" data-i18n-title="north"><i class="fa-solid fa-location-arrow" id="northIcon"></i></button>
            <button class="rail-btn" id="fullscreenBtn" data-i18n-title="fullscreen"><i class="fa-solid fa-expand"></i></button>
        </div>
        <div class="rail-group glass">
            <button class="rail-btn" id="layersBtn" data-i18n-title="layers"><i class="fa-solid fa-layer-group"></i></button>
            <button class="rail-btn" id="rulerBtn" data-i18n-title="ruler"><i class="fa-solid fa-ruler-combined"></i></button>
            <button class="rail-btn" id="clearRulerBtn" data-i18n-title="clearRuler" hidden><i class="fa-solid fa-eraser"></i></button>
            <button class="rail-btn" id="coordBtn" data-i18n-title="coords"><i class="fa-solid fa-location-crosshairs"></i></button>
        </div>
    </nav>

    <div class="popover glass" id="layersPopover" hidden>
        <h3 data-i18n="layers"></h3>
        <div id="layerOptions"></div>
    </div>

    <div class="popover glass" id="coordPopover" hidden>
        <h3 data-i18n="coordTitle"></h3>
        <label>
            <span data-i18n="coordClicked"></span>
            <span class="field">
                <input class="input mono" id="coordClicked" readonly data-i18n-placeholder="coordPlaceholder">
                <button class="icon-btn" id="coordCopy" data-i18n-title="copy"><i class="fa-solid fa-copy"></i></button>
            </span>
        </label>
        <form id="coordForm">
            <label>
                <span data-i18n="coordGoTo"></span>
                <span class="field">
                    <input class="input mono" id="coordGoTo" placeholder="40.4093, 49.8671" inputmode="decimal">
                    <button class="icon-btn" type="submit" data-i18n-title="go"><i class="fa-solid fa-arrow-right"></i></button>
                </span>
            </label>
        </form>
    </div>

    <div class="measure-hint glass" id="measureHint" data-i18n="measureHint" hidden></div>
    <div class="measure-tip" id="measureTip" hidden></div>

    <!-- ŞƏRTİ İŞARƏLƏR -->
    <section class="legend glass" id="legend" aria-label="Şərti işarələr"></section>

    <div class="cursor-coords mono glass" id="cursorCoords">40.14300, 47.57700</div>

    <!-- CƏDVƏL -->
    <section class="drawer glass" id="drawer">
        <button class="drawer-head" id="drawerToggle" aria-expanded="false">
            <span><i class="fa-solid fa-table-list"></i> <span data-i18n="tableTitle"></span> <span class="muted" id="drawerCount"></span></span>
            <span class="drawer-summary mono" id="drawerSummary"></span>
            <i class="fa-solid fa-chevron-up" id="drawerArrow"></i>
        </button>
        <div class="drawer-body" id="drawerBody" hidden>
            <div class="table-wrap">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                    <tfoot id="tableFoot"></tfoot>
                </table>
            </div>
            <div class="contractors">
                <h3><i class="fa-solid fa-helmet-safety"></i> <span data-i18n="contractors"></span></h3>
                <div id="contractorList"></div>
            </div>
        </div>
    </section>

    <!-- MATERİAL REYESTRİ -->
    <dialog class="modal" id="materialsModal">
        <div class="modal-head">
            <h2><i class="fa-solid fa-boxes-stacked"></i> <span data-i18n="materials"></span></h2>
            <button class="icon-btn" data-close data-i18n-title="close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <p class="muted" data-i18n="materialsHint"></p>
        <div class="table-wrap">
            <table>
                <thead id="materialsHead"></thead>
                <tbody id="materialsBody"></tbody>
            </table>
        </div>
    </dialog>

    <!-- QEYDLƏR -->
    <dialog class="modal modal-sm" id="notesModal">
        <div class="modal-head">
            <h2><i class="fa-solid fa-note-sticky"></i> <span data-i18n="notesTitle"></span></h2>
            <button class="icon-btn" data-close data-i18n-title="close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="noteForm">
            <textarea class="input" id="noteInput" rows="3" data-i18n-placeholder="notePlaceholder"></textarea>
            <button class="btn btn-primary btn-block" type="submit" data-i18n="noteAdd"></button>
        </form>
        <div class="notes" id="notesList"></div>
    </dialog>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
